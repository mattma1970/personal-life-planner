# PersonalLifePlanner configuration.
# Keep this file clean; secrets belong in config/secrets/ (gitignored).

# Self-hosted LLM ("the brain"). Any OpenAI-compatible server works:
# Ollama -> http://127.0.0.1:11434/v1, vLLM -> http://127.0.0.1:8000/v1, ...
# If the endpoint is unreachable, PLP runs in degraded (LLM-less) mode.
llm:
  base_url: "http://127.0.0.1:11434/v1"
  model: "qwen3.8-27b"
  api_key: ""               # optional; most local servers ignore it
  timeout_seconds: 120
  max_tool_steps: 8         # step budget per agent turn

# All schedules use this timezone (omit to use the system local timezone).
timezone: ""

delivery:
  terminal: true
  email:
    enabled: false
    from: ""
    to: ""
    smtp_url: ""            # e.g. smtp://user:pass@smtp.gmail.com:587

vault:
  path: "plp-vault"         # Obsidian-compatible markdown vault (git-tracked)

state_db:
  path: "data/plp.db"

plugins:
  dir: "plugins"

# Per-job schedule overrides (cron, 5 fields). Defaults live in the plugin
# manifests; anything listed here wins.
schedules: {}
#  news.collect: "0 7 * * *"
#  daily.digest: "5 7 * * *"
#  checkup.weekly: "0 20 * * 0"

# Delivery of LLM features that are off by default.
features:
  email_summarization: false   # let the LLM summarize email threads (off = local-only triage)

# News collector (Phase 2). Leave `sources` empty to use the built-in
# AI-focused list (OpenAI, Anthropic, Google DeepMind, Google Research,
# Hugging Face, arXiv cs.LG, Hacker News, r/LocalLLaMA); any sources listed
# here replace the built-ins wholesale.
news:
  max_age_hours: 72
  per_source_limit: 25
  digest_max_items: 8
  digest_window_hours: 48
  sources: []
#  sources:
#    - {name: "Example Blog", url: "https://example.com/feed", kind: rss, weight: 1.0}

# Calendar spine (Phase 4). The ICS file is human-readable and can be opened
# in any calendar app; the daemon merges on every write, so edits you make in
# your calendar tool survive. Google backend: see docs/google-calendar-setup.md
# (disabled until `enabled: true` + a connected credentials file).
calendar:
  backend: ics
  ics_file: "data/calendar/main.ics"
  week_start: 1              # 0=Sunday … 6=Saturday (drives `plp calendar week`)
  categories: []             # suggested labels, e.g. [family, work, health, self, free]
  google:
    enabled: false
    credentials_file: ""     # e.g. data/calendar/credentials.json (gitignored)
#  google:
#    enabled: true
#    credentials_file: "data/calendar/credentials.json"

# Gift vault (Phase 3). Gifts are captured with `plp gift add "..."` and live
# in plp-vault/gifts/. `occasions` are the recurring dates the Sunday review
# watches — fill these in (her birthday, your anniversary, ...).
gifts:
  review_window_days: 90     # how far ahead the review looks for occasions
  stale_after_days: 30       # an 'idea' this old is called out for a decision
  occasions: []
#  occasions:
#    - {name: "her birthday", month: 6, day: 2}
#    - {name: "anniversary", month: 7, day: 20}

# Holiday planner (Phase 3). Preferences live in the vault file below (edit
# it freely — the LLM reads it when brainstorming). A budget of 0 means no
# ceiling was stated.
travel:
  max_budget: 0
  max_trip_days: 14
  preferences: "travel/preferences.md"
